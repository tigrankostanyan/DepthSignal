# MyScreener reverse proxy.
# Works both in docker compose (proxy_pass http://app:8080) and on a VPS
# (change the upstream to 127.0.0.1:8080). Drop into /etc/nginx/conf.d/.

upstream myscreener {
    server app:8080;              # compose; use 127.0.0.1:8080 on a VPS
    keepalive 32;
}

server {
    listen 80;
    server_name screener.example.com;   # ← set your domain

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 12m;     # receipts are base64, allow some headroom above the 8MB API limit

    location / {
        proxy_pass http://myscreener;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE (/api/realtime/stream) must not be buffered
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

